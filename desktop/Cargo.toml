[package]
name = "agely"
version = "0.1.3"
description = "Agely desktop walkthrough"
authors = ["Volodymyr IER", "Agely core contributors"]
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "agely_native"

[[bin]]
name = "agely"
path = "src/main.rs"
required-features = ["native-ui"]

[features]
default = ["native-ui"]
native-ui = ["dep:gpui", "dep:gpui_platform", "dep:unicode-segmentation"]

[dependencies]
anyhow = "1"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "0a514d7ef59c6357878a244fdf8365d03c504767", default-features = false, optional = true }
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "0a514d7ef59c6357878a244fdf8365d03c504767", default-features = false, features = ["font-kit", "runtime_shaders"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", features = ["local-offset"] }
unicode-normalization = "0.1"
unicode-segmentation = { version = "1", optional = true }

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "0a514d7ef59c6357878a244fdf8365d03c504767", default-features = false, features = ["test-support"] }
