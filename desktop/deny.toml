# Licence and advisory policy for the Rust dependencies (constitution principle VI).
# Run with `cargo deny check` in desktop/. CI runs it on every pull request.

[graph]
# Agely ships for macOS first; check the targets the app is built for.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# Fail on known vulnerabilities and on unmaintained crates we depend on directly.
unmaintained = "workspace"

[licenses]
# Permissive licences, plus MPL-2.0. MPL is file-level copyleft: it obliges us to share changes
# to the MPL files themselves, not our own code.
# To add a licence, name it here with the crate that needs it.
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    # arrayref, used by GPUI's SVG renderer, uses this permissive licence.
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# GPUI's current accessibility APIs require this upstream source. Its exact revision is
# pinned in Cargo.toml and Cargo.lock. Its macOS font dependency is Zed's font-kit fork,
# pinned upstream to 94b0f28166665e8fd2f53ff6d268a14955c82269. Other sources remain rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/zed-industries/zed", "https://github.com/zed-industries/font-kit"]
required-git-spec = "rev"
